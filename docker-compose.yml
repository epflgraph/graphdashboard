services:

  loki:
    container_name: loki
    image: grafana/loki:3.3.2
    user: "0"
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - ./.data/loki/data:/loki
      - ./.data/loki/wal:/wal

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    user: "${UID}:${GID}"
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.external-url=https://graphdash.graphcert.cede-apps.ch:8444/prometheus/"
      - "--web.route-prefix=/prometheus/"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./.data/prometheus:/prometheus

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    user: "${UID}:${GID}"
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${PROD_DASH_GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${PROD_DASH_GRAFANA_ADMIN_PASS}
      GF_SERVER_ROOT_URL: https://graphdash.graphcert.cede-apps.ch:8444/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./.data/grafana:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  postgres:
    container_name: infisical-postgres
    image: postgres:16
    user: "${UID}:${GID}"
    restart: always
    environment:
      POSTGRES_USER: ${PROD_DASH_POSTGRES_INFISICAL_USER}
      POSTGRES_PASSWORD: ${PROD_DASH_POSTGRES_INFISICAL_PASS}
      POSTGRES_DB: infisical_db
    volumes:
      - infisical-db-bind:/var/lib/postgresql/data

  redis:
    container_name: infisical-redis
    image: redis:7
    user: "${UID}:${GID}"
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - infisical-redis-bind:/data

  infisical:
    image: infisical/infisical:latest
    container_name: infisical
    restart: always
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
      - .infisical.env
    environment:
      DB_CONNECTION_URI: postgresql://${PROD_DASH_POSTGRES_INFISICAL_USER}:${PROD_DASH_POSTGRES_INFISICAL_PASS}@postgres:5432/infisical_db
      REDIS_URL: redis://redis:6379
      SITE_URL: https://graphdash.graphcert.cede-apps.ch:9443
      HOST: 0.0.0.0
      PORT: 8080
      INFISICAL_DISABLE_UPDATE_CHECK: "true"
    mem_limit: 768m
    memswap_limit: 768m
    cpus: "1.0"
    pids_limit: 256

  dashy:
    image: lissy93/dashy:latest
    container_name: dashy
    restart: unless-stopped
    volumes:
      - ./config/dashy/config.yml:/app/user-data/conf.yml
      - ./config/dashy/icons:/app/user-data/item-icons

  reverse-proxy:
    image: nginx:1.27
    container_name: graphdashboard-reverse-proxy
    restart: unless-stopped
    depends_on:
      - dashy
      - grafana
      - prometheus
      - loki
      - infisical
    ports:
      - "8081:80"
      - "8444:443"
      - "9443:9443"
    volumes:
      - ./nginx.graphdash-https.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:

  infisical-db-bind:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./.data/infisical/postgres

  infisical-redis-bind:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./.data/infisical/redis
