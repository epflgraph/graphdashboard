# Dashy is served on 443 by the external edge reverse proxy
# (graphregistry-nginx), which forwards to Dashy at 127.0.0.1:8090.

server {
    listen 9444 ssl;
    http2 on;
    server_name graphdash.graphcert.cede-apps.ch;

    ssl_certificate     /etc/letsencrypt/live/graphcert.cede-apps.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/graphcert.cede-apps.ch/privkey.pem;

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 9445 ssl;
    http2 on;
    server_name graphdash.graphcert.cede-apps.ch;

    ssl_certificate     /etc/letsencrypt/live/graphcert.cede-apps.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/graphcert.cede-apps.ch/privkey.pem;

    location / {
        proxy_pass http://prometheus:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 9446 ssl;
    http2 on;
    server_name graphdash.graphcert.cede-apps.ch;

    ssl_certificate     /etc/letsencrypt/live/graphcert.cede-apps.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/graphcert.cede-apps.ch/privkey.pem;

    location / {
        proxy_pass http://infisical:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name graphdash.graphcert.cede-apps.ch localhost 127.0.0.1;

    # Loki write path — the only location reachable from the LAN, and only
    # from the RCP host that runs the graphai promtail. Local shippers
    # (loopback, docker networks) stay allowed.
    location = /loki/api/v1/push {
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;   # docker networks on this host
        allow 10.92.36.18;     # graph-gpu1-prod-rcp (graphai promtail)
        deny all;
        proxy_pass http://loki:3100;
    }

    # Loki read path and everything else — loopback and local docker only.
    location /loki/ {
        allow 127.0.0.1;
        allow ::1;
        allow 172.16.0.0/12;   # docker networks on this host
        deny all;
        proxy_pass http://loki:3100/loki/;
    }
}