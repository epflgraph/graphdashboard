server {
    listen 8444 ssl;
    http2 on;
    server_name graphdash.graphcert.cede-apps.ch;

    ssl_certificate     /etc/letsencrypt/live/graphcert.cede-apps.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/graphcert.cede-apps.ch/privkey.pem;

    location / {
        proxy_pass http://dashy:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 9444 ssl;
    http2 on;
    server_name graphdash.graphcert.cede-apps.ch;

    ssl_certificate     /etc/letsencrypt/live/graphcert.cede-apps.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/graphcert.cede-apps.ch/privkey.pem;

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 9445 ssl;
    http2 on;
    server_name graphdash.graphcert.cede-apps.ch;

    ssl_certificate     /etc/letsencrypt/live/graphcert.cede-apps.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/graphcert.cede-apps.ch/privkey.pem;

    location / {
        proxy_pass http://prometheus:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 9446 ssl;
    http2 on;
    server_name graphdash.graphcert.cede-apps.ch;

    ssl_certificate     /etc/letsencrypt/live/graphcert.cede-apps.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/graphcert.cede-apps.ch/privkey.pem;

    location / {
        proxy_pass http://infisical:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name graphdash.graphcert.cede-apps.ch localhost 127.0.0.1;

    location /loki/ {
        proxy_pass http://loki:3100/loki/;
    }
}