# .gitleaks.toml
title = "graphdb gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Ignore demo/sample external keys and placeholder passwords"
regexTarget = "line"
regexes = [
    '''password\=\{os.getenv''',
    '''password\"\]\)''',
    '''mysql\+pymysql\:\/\/\{params\[''',
    '''\{\"id\"\:7\,\"token\"\:\"abc123\"\}''',
    '''(?i)password\s*:\s*(something|<YOUR_PASSWORD>|<YOUR_USERNAME>|YOUR_PASSWORD|YOUR_USERNAME|changeme|change_me|example|example_password)'''
]

###############################################################################
# Aggressive custom rules
###############################################################################

[[rules]]
id = "private-key-generic"
description = "Generic private key block"
regex = '''-----BEGIN[ A-Z0-9_-]*PRIVATE KEY-----'''
keywords = ["PRIVATE KEY"]
secretGroup = 0

[[rules]]
id = "ssh-private-key-inline"
description = "OpenSSH private key"
regex = '''-----BEGIN OPENSSH PRIVATE KEY-----'''
keywords = ["OPENSSH PRIVATE KEY"]
secretGroup = 0

[[rules]]
id = "jwt-token"
description = "JWT token"
regex = '''\b(eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9._-]{8,}\.[A-Za-z0-9._-]{8,})\b'''
keywords = ["eyJ"]
secretGroup = 1
entropy = 3.0

[[rules]]
id = "bearer-token"
description = "Bearer token in code, config, logs, or headers"
regex = '''(?i)\bBearer\s+([A-Za-z0-9\-._~+/]+=*)\b'''
keywords = ["Bearer"]
secretGroup = 1
entropy = 3.5

[[rules]]
id = "authorization-header"
description = "Authorization header with possible secret"
regex = '''(?i)\bAuthorization\b\s*[:=]\s*["']?(?:Bearer|Basic|Token)\s+([A-Za-z0-9\-._~+/=:]+)["']?'''
keywords = ["Authorization", "Bearer", "Basic", "Token"]
secretGroup = 1
entropy = 3.0

[[rules]]
id = "basic-auth-url"
description = "URL with embedded basic auth credentials"
regex = '''\b[a-zA-Z][a-zA-Z0-9+.-]*://[^/\s:@]+:([^/\s@]+)@[^/\s]+'''
keywords = ["://", "@"]
secretGroup = 1
entropy = 2.5

[[rules]]
id = "generic-password-assignment"
description = "Generic password assignment"
regex = '''(?i)\b(?:password|passwd|pwd|passphrase)\b\s*[:=]\s*["']?([^\s"',;}{]{6,})["']?'''
keywords = ["password", "passwd", "pwd", "passphrase"]
secretGroup = 1
entropy = 2.5

[[rules]]
id = "generic-secret-assignment"
description = "Generic secret assignment"
regex = '''(?i)\b(?:secret|client_secret|secret_key|shared_secret|signing_secret|jwt_secret|session_secret|cookie_secret)\b\s*[:=]\s*["']?([A-Za-z0-9\/+=._\-]{8,})["']?'''
keywords = ["secret", "client_secret", "secret_key", "jwt_secret"]
secretGroup = 1
entropy = 3.0

[[rules]]
id = "generic-token-assignment"
description = "Generic token assignment"
regex = '''(?i)\b(?:token|access_token|refresh_token|id_token|auth_token|api_token|private_token|session_token)\b\s*[:=]\s*["']?([A-Za-z0-9\/+=._\-]{8,})["']?'''
keywords = ["token", "access_token", "refresh_token", "api_token"]
secretGroup = 1
entropy = 3.0

[[rules]]
id = "generic-api-key-assignment"
description = "Generic API key assignment"
regex = '''(?i)\b(?:api[_-]?key|apikey|app[_-]?key|consumer[_-]?key|client[_-]?key|access[_-]?key|secret[_-]?access[_-]?key)\b\s*[:=]\s*["']?([A-Za-z0-9\/+=._\-]{8,})["']?'''
keywords = ["api_key", "apikey", "client_key", "access_key"]
secretGroup = 1
entropy = 3.0

[[rules]]
id = "database-url-with-password"
description = "Database URL containing inline password"
regex = '''\b(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis|rediss|mssql|sqlserver|oracle|amqp|kafka):\/\/[^/\s:@]+:([^/\s@]+)@[^/\s]+'''
keywords = ["postgres://", "postgresql://", "mysql://", "mongodb://", "redis://", "amqp://"]
secretGroup = 1
entropy = 2.5

[[rules]]
id = "jdbc-url-with-password"
description = "JDBC connection string with password parameter"
regex = '''(?i)\bjdbc:[^\s"']+?(?:password|pwd)=([^;'"&\s]+)'''
keywords = ["jdbc:", "password=", "pwd="]
secretGroup = 1
entropy = 2.5

[[rules]]
id = "db-password-parameter"
description = "Database password parameter in config"
regex = '''(?i)\b(?:db[_-]?password|database[_-]?password|datasource[_-]?password)\b\s*[:=]\s*["']?([^\s"',;}{]{6,})["']?'''
keywords = ["db_password", "database_password", "datasource_password"]
secretGroup = 1
entropy = 2.5

[[rules]]
id = "aws-access-key-id-custom"
description = "AWS access key ID"
regex = '''\b((?:AKIA|ASIA|AIDA|AROA)[A-Z0-9]{16})\b'''
keywords = ["AKIA", "ASIA", "AIDA", "AROA"]
secretGroup = 1
entropy = 3.0

[[rules]]
id = "aws-secret-access-key-assignment"
description = "AWS secret access key assignment"
regex = '''(?i)\baws[_-]?secret[_-]?access[_-]?key\b\s*[:=]\s*["']?([A-Za-z0-9/+=]{40})["']?'''
keywords = ["aws_secret_access_key"]
secretGroup = 1
entropy = 3.5

[[rules]]
id = "github-token"
description = "GitHub token"
regex = '''\b(gh[pousr]_[A-Za-z0-9]{20,255})\b'''
keywords = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_"]
secretGroup = 1
entropy = 3.0

[[rules]]
id = "gitlab-token"
description = "GitLab token / PAT assignment"
regex = '''(?i)\b(?:gitlab[_-]?token|private[_-]?token)\b\s*[:=]?\s*["']?(glpat-[A-Za-z0-9\-_]{20,})["']?'''
keywords = ["glpat-", "private_token", "gitlab_token"]
secretGroup = 1
entropy = 3.0

[[rules]]
id = "slack-token"
description = "Slack token"
regex = '''\b(xox[baprs]-[A-Za-z0-9-]{10,200})\b'''
keywords = ["xoxb-", "xoxa-", "xoxp-", "xoxr-", "xoxs-"]
secretGroup = 1
entropy = 3.0

[[rules]]
id = "slack-webhook"
description = "Slack webhook URL"
regex = '''https://hooks\.slack\.com/services/([A-Za-z0-9/_-]+)'''
keywords = ["hooks.slack.com/services/"]
secretGroup = 1
entropy = 2.5

[[rules]]
id = "discord-webhook"
description = "Discord webhook URL"
regex = '''https://(?:canary\.)?discord(?:app)?\.com/api/webhooks/([0-9]+/[A-Za-z0-9._-]+)'''
keywords = ["discord.com/api/webhooks/", "discordapp.com/api/webhooks/"]
secretGroup = 1
entropy = 2.5

[[rules]]
id = "stripe-key"
description = "Stripe secret or restricted key"
regex = '''\b((?:sk|rk)_(?:live|test)_[A-Za-z0-9]{16,})\b'''
keywords = ["sk_live_", "sk_test_", "rk_live_", "rk_test_"]
secretGroup = 1
entropy = 3.0

[[rules]]
id = "sendgrid-api-key"
description = "SendGrid API key"
regex = '''\b(SG\.[A-Za-z0-9._-]{16,}\.[A-Za-z0-9._-]{16,})\b'''
keywords = ["SG."]
secretGroup = 1
entropy = 3.0

[[rules]]
id = "twilio-api-key"
description = "Twilio API key SID"
regex = '''\b(SKr[a-fA-F0-9]{32})\b'''
keywords = ["SK"]
secretGroup = 1
entropy = 3.0

[[rules]]
id = "npm-token"
description = "NPM auth token"
regex = '''\b(npm_[A-Za-z0-9]{20,})\b'''
keywords = ["npm_"]
secretGroup = 1
entropy = 3.0

[[rules]]
id = "pypi-token"
description = "PyPI token"
regex = '''\b(pypi-[A-Za-z0-9_-]{20,})\b'''
keywords = ["pypi-"]
secretGroup = 1
entropy = 3.0

[[rules]]
id = "docker-auth-config"
description = "Docker auth field"
regex = '''(?i)"auth"\s*:\s*"([A-Za-z0-9+/=]{12,})"'''
keywords = ["\"auth\""]
secretGroup = 1
entropy = 3.0

[[rules]]
id = "firebase-server-key"
description = "Firebase server key"
regex = '''\b(AAAA[A-Za-z0-9_-]{7}:[A-Za-z0-9_-]{100,})\b'''
keywords = ["AAAA"]
secretGroup = 1
entropy = 3.0

[[rules]]
id = "google-api-key"
description = "Google API key"
regex = '''\b(AIza[0-9A-Za-z\-_]{35})\b'''
keywords = ["AIza"]
secretGroup = 1
entropy = 3.0

[[rules]]
id = "mailgun-key"
description = "Mailgun API key"
regex = '''\b(key-[0-9a-fA-F]{32})\b'''
keywords = ["key-"]
secretGroup = 1
entropy = 3.0

[[rules]]
id = "shopify-token"
description = "Shopify access token assignment"
regex = '''(?i)\b(?:shopify[_-]?access[_-]?token|shopify[_-]?token)\b\s*[:=]\s*["']?([A-Za-z0-9_\-]{16,})["']?'''
keywords = ["shopify_access_token", "shopify_token"]
secretGroup = 1
entropy = 3.0

[[rules]]
id = "telegram-bot-token"
description = "Telegram bot token"
regex = '''\b([0-9]{6,12}:[A-Za-z0-9_-]{30,})\b'''
keywords = [":"]
secretGroup = 1
entropy = 3.0

[[rules]]
id = "high-entropy-secret-near-keyword"
description = "High-entropy value near secret-like keyword"
regex = '''(?i)\b(?:secret|token|password|passwd|pwd|api[_-]?key|apikey|client[_-]?secret|access[_-]?token|refresh[_-]?token)\b.{0,20}["'=:\s]+([A-Za-z0-9\/+=._\-]{16,})'''
keywords = ["secret", "token", "password", "api_key", "apikey", "client_secret"]
secretGroup = 1
entropy = 3.5

[[rules]]
id = "base64ish-secret-near-keyword"
description = "Base64-like secret near suspicious keyword"
regex = '''(?i)\b(?:secret|token|password|authorization|auth|credential)\b.{0,20}["'=:\s]+([A-Za-z0-9+/]{20,}={0,2})'''
keywords = ["secret", "token", "password", "authorization", "credential"]
secretGroup = 1
entropy = 4.0

[[rules]]
id = "env-secret-export"
description = "Environment variable export of secret-looking value"
regex = '''(?i)\b(?:export\s+)?(?:AWS_SECRET_ACCESS_KEY|AWS_ACCESS_KEY_ID|DATABASE_URL|REDIS_URL|MONGO_URL|MONGODB_URI|POSTGRES_URL|PGPASSWORD|MYSQL_PWD|JWT_SECRET|SECRET_KEY|API_KEY|ACCESS_TOKEN|REFRESH_TOKEN|GITHUB_TOKEN|GITLAB_TOKEN|NPM_TOKEN|PYPI_TOKEN|SLACK_BOT_TOKEN|STRIPE_SECRET_KEY)\b\s*=\s*["']?([^\s"'`]+)["']?'''
keywords = [
  "AWS_SECRET_ACCESS_KEY",
  "AWS_ACCESS_KEY_ID",
  "DATABASE_URL",
  "MONGODB_URI",
  "JWT_SECRET",
  "SECRET_KEY",
  "API_KEY",
  "ACCESS_TOKEN",
  "GITHUB_TOKEN",
  "NPM_TOKEN"
]
secretGroup = 1
entropy = 2.5
